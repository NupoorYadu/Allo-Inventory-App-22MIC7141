name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run build

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Validate API routes
        run: |
          test -f "app/api/products/route.ts" || (echo "Missing products API" && exit 1)
          test -f "app/api/reservations/route.ts" || (echo "Missing reservations API" && exit 1)
          test -f "app/api/reservations/\[id\]/confirm/route.ts" || (echo "Missing confirm API" && exit 1)
          test -f "app/api/reservations/\[id\]/release/route.ts" || (echo "Missing release API" && exit 1)
          test -f "app/api/cron/release-expired/route.ts" || (echo "Missing cron job" && exit 1)

